name: Deploy CONTROLVERSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controlverse-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and validate the static site
        run: |
          unzip -q controlverse-publish-ready-v3.zip -d public-site -x '.github/*' README.md
          test -f public-site/index.html
          test -f public-site/sitemap.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
